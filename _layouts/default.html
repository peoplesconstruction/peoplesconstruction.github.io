<!DOCTYPE html>
<html lang="{{ page.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }} | BCCA Peoples Construction LTD</title>
  <meta name="description" content="{{ page.description | default: site.description }}">

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=AW-18062849405"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'AW-18062849405');
    gtag('config', 'G-2Z9HDSJQTV');
  </script>

  <!-- Event snippet for Click to call conversion page -->
  <script>
  function gtag_report_conversion_call(url) {
    var callback = function () {
      if (typeof(url) != 'undefined') {
        window.location = url;
      }
    };
    gtag('event', 'conversion', {
        'send_to': 'AW-18062849405/kt0hCJDG4qEcEP3qhKVD',
        'value': 1.0,
        'currency': 'CAD',
        'event_callback': callback
    });
    return false;
  }
  </script>

  <!-- Event snippet for Email conversion page -->
  <script>
  function gtag_report_conversion_email(url) {
    var callback = function () {
      if (typeof(url) != 'undefined') {
        window.location = url;
      }
    };
    gtag('event', 'conversion', {
        'send_to': 'AW-18062849405/2US0CM2oy6EcEP3qhKVD',
        'value': 1.0,
        'currency': 'CAD',
        'event_callback': callback
    });
    return false;
  }
  </script>

  <!-- Event snippet for Form submission conversion page -->
  <script>
  function gtag_report_conversion_form() {
    gtag('event', 'conversion', {
        'send_to': 'AW-18062849405/2v0bCJPxuaIcEP3qhKVD',
        'value': 5.0,
        'currency': 'CAD'
    });
  }
  </script>

  {% if page.lang == 'en' and page.zh_pair %}
  <link rel="alternate" hreflang="zh" href="{{ site.url }}{{ page.zh_pair }}">
  <link rel="alternate" hreflang="en" href="{{ page.url }}">
  {% elsif page.lang == 'zh' and page.en_pair %}
  <link rel="alternate" hreflang="en" href="{{ site.url }}{{ page.en_pair }}">
  <link rel="alternate" hreflang="zh" href="{{ page.url }}">
  {% endif %}

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Montserrat:wght@600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/assets/css/main.css">

  {% if page.lang == 'en' %}
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "LocalBusiness",
    "name": "BCCA Peoples Construction LTD",
    "description": "Quality Landscaping & Construction in Greater Vancouver Since 2009",
    "url": "{{ site.url }}",
    "telephone": "{{ site.data.contact.phone_en }}",
    "email": "{{ site.data.contact.email }}",
    "contactPoint": [
      {
        "@type": "ContactPoint",
        "telephone": "{{ site.data.contact.phone_en }}",
        "contactType": "customer service",
        "availableLanguage": "English"
      },
      {
        "@type": "ContactPoint",
        "telephone": "{{ site.data.contact.phone_zh }}",
        "contactType": "customer service",
        "availableLanguage": "Chinese"
      }
    ],
    "address": {
      "@type": "PostalAddress",
      "addressLocality": "Vancouver",
      "addressRegion": "BC",
      "addressCountry": "CA"
    },
    "areaServed": "Greater Vancouver",
    "foundingDate": "2009"
  }
  </script>
  {% endif %}
</head>
<body>
  {% include header.html %}
  <main>
    {{ content }}
  </main>
  {% include footer.html %}
  <script src="/assets/js/main.js"></script>
</body>
</html>
